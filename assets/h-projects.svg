<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" role="img" aria-label="Projects">
  <style>.e rect{transform-box:fill-box;transform-origin:bottom;animation:e .9s ease-in-out infinite alternate}.e rect:nth-child(2){animation-delay:-.3s}.e rect:nth-child(3){animation-delay:-.6s}@keyframes e{from{transform:scaleY(.3)}to{transform:scaleY(1)}}</style>
  <rect width="1200" height="64" rx="14" fill="#121212"/>
  <g class="e" fill="#1ed760"><rect x="24" y="18" width="5" height="28" rx="2"/><rect x="33" y="18" width="5" height="28" rx="2"/><rect x="42" y="18" width="5" height="28" rx="2"/></g>
  <text x="64" y="42" font-family="'Helvetica Neue',-apple-system,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#ffffff">Projects</text>
</svg>