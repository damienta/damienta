<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Damien Wrapped. Top genre: platform engineering. Biggest hit: deploys 70 percent faster at Runna. Award: CASM Technology Track winner, HackSussex 2025. Graduated with First Class Honours from Southampton. Most played: Terraform, GitHub Actions, Python.">
  <style>
    .sans{font-family:"Circular","Helvetica Neue",-apple-system,"Segoe UI",Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .pop{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.85) rotate(-3deg);animation:pop .6s cubic-bezier(.3,1.4,.4,1) forwards}
    .p1{animation-delay:.2s}.p2{animation-delay:.5s}.p3{animation-delay:.8s}.p4{animation-delay:1.1s}.p5{animation-delay:1.4s}
    @keyframes pop{to{opacity:1;transform:none}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 12s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <rect width="1200" height="430" rx="28" fill="#121212"/>
  <text x="40" y="62" class="sans" font-size="40" font-weight="900" fill="#fff">Damien <tspan fill="#1ed760">Wrapped</tspan></text>
  <text x="1160" y="60" class="mono" font-size="13" fill="#b3b3b3" text-anchor="end" letter-spacing="2">YOUR CAREER SO FAR</text>

  <g class="pop p1">
    <rect x="40" y="90" width="360" height="150" rx="20" fill="#1ed760"/>
    <circle class="spin" cx="360" cy="120" r="60" fill="none" stroke="#121212" stroke-opacity=".15" stroke-width="14" stroke-dasharray="20 14"/>
    <text x="64" y="128" class="mono" font-size="13" fill="#121212" letter-spacing="2">TOP GENRE</text>
    <text x="64" y="178" class="sans" font-size="34" font-weight="900" fill="#121212">Platform</text>
    <text x="64" y="214" class="sans" font-size="34" font-weight="900" fill="#121212">Engineering</text>
  </g>
  <g class="pop p2">
    <rect x="420" y="90" width="360" height="150" rx="20" fill="#f573a0"/>
    <text x="444" y="128" class="mono" font-size="13" fill="#2b0a17" letter-spacing="2">BIGGEST HIT</text>
    <text x="444" y="190" class="sans" font-size="56" font-weight="900" fill="#2b0a17">70%</text>
    <text x="444" y="220" class="sans" font-size="17" font-weight="700" fill="#2b0a17">faster deploys at Runna</text>
  </g>
  <g class="pop p3">
    <rect x="800" y="90" width="360" height="150" rx="20" fill="#9b7bd4"/>
    <text x="824" y="128" class="mono" font-size="13" fill="#1a0f2e" letter-spacing="2">AWARD</text>
    <text x="824" y="178" class="sans" font-size="30" font-weight="900" fill="#1a0f2e">HackSussex 2025</text>
    <text x="824" y="212" class="sans" font-size="17" font-weight="700" fill="#1a0f2e">CASM Technology Track winner</text>
  </g>
  <g class="pop p4">
    <rect x="40" y="260" width="540" height="140" rx="20" fill="#f5d33a"/>
    <text x="64" y="298" class="mono" font-size="13" fill="#2a2306" letter-spacing="2">GRADUATED</text>
    <text x="64" y="346" class="sans" font-size="34" font-weight="900" fill="#2a2306">First Class Honours</text>
    <text x="64" y="378" class="sans" font-size="17" font-weight="700" fill="#2a2306">BSc Computer Science, University of Southampton</text>
  </g>
  <g class="pop p5">
    <rect x="600" y="260" width="560" height="140" rx="20" fill="#2a2a2a"/>
    <text x="624" y="298" class="mono" font-size="13" fill="#b3b3b3" letter-spacing="2">MOST PLAYED</text>
    <text x="624" y="336" class="sans" font-size="22" font-weight="800" fill="#fff"><tspan fill="#1ed760">1</tspan>  Terraform</text>
    <text x="624" y="362" class="sans" font-size="22" font-weight="800" fill="#fff"><tspan fill="#1ed760">2</tspan>  GitHub Actions</text>
    <text x="624" y="388" class="sans" font-size="22" font-weight="800" fill="#fff"><tspan fill="#1ed760">3</tspan>  Python</text>
    <g fill="#1ed760" transform="translate(1060 300)">
      <rect width="10" height="80" rx="3" opacity=".9"/><rect x="16" y="20" width="10" height="60" rx="3" opacity=".7"/><rect x="32" y="40" width="10" height="40" rx="3" opacity=".5"/><rect x="48" y="55" width="10" height="25" rx="3" opacity=".3"/>
    </g>
  </g>
</svg>
