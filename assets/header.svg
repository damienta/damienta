<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Damien Ta, Platform and DevOps Engineer. Press start.">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <pattern id="pix" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="#ffffff" opacity=".06"/></pattern>
    <linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#e0f7ff"/><stop offset=".55" stop-color="#7dd3fc"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>
  <style>
    .a1{animation:d1 14s ease-in-out infinite alternate}
    .a2{animation:d2 18s ease-in-out infinite alternate}
    .a3{animation:d3 16s ease-in-out infinite alternate}
    @keyframes d1{to{transform:translate(260px,40px)}}
    @keyframes d2{to{transform:translate(-300px,-30px)}}
    @keyframes d3{to{transform:translate(120px,-60px)}}
    .w{opacity:0;filter:blur(14px);animation:in .9s cubic-bezier(.2,.7,.2,1) forwards}
    .w1{animation-delay:.2s}.w2{animation-delay:.45s}.w3{animation-delay:.9s}.w4{animation-delay:1.3s}
    @keyframes in{to{opacity:1;filter:blur(0)}}
    .blink{animation:in .1s 1.8s forwards,bl 1.1s 1.9s steps(2,start) infinite}
    @keyframes bl{to{visibility:hidden}}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#070a12"/>
    <g filter="url(#blur)" opacity=".85">
      <ellipse class="a1" cx="260" cy="120" rx="260" ry="120" fill="#0891b2"/>
      <ellipse class="a2" cx="880" cy="200" rx="300" ry="130" fill="#4338ca"/>
      <ellipse class="a3" cx="600" cy="300" rx="240" ry="90" fill="#0f766e"/>
    </g>
    <rect width="1200" height="320" fill="url(#pix)"/>
    <text x="40" y="48" class="mono w w1" font-size="15" fill="#67e8f9" letter-spacing="3">PLAYER 1</text>
    <text x="1160" y="48" class="mono w w1" font-size="15" fill="#c7d2fe" letter-spacing="3" text-anchor="end">HI-SCORE  DEPLOYS 70% FASTER</text>
    <text x="600" y="170" class="sans w w2" font-size="92" font-weight="800" fill="url(#title)" text-anchor="middle" letter-spacing="2">DAMIEN TA</text>
    <text x="600" y="218" class="mono w w3" font-size="22" fill="#e2e8f0" text-anchor="middle" letter-spacing="2">PLATFORM / DEVOPS ENGINEER</text>
    <text x="600" y="276" class="mono blink" font-size="18" fill="#fde68a" text-anchor="middle" letter-spacing="4" opacity="0">&#9654; PRESS START</text>
  </g>
</svg>
