<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="spotify-stats cover art">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1ed760"/><stop offset="1" stop-color="#0b5e2a"/></linearGradient></defs>
  <style>.b{transform-box:fill-box;transform-origin:bottom;animation:e 1s ease-in-out infinite alternate}@keyframes e{from{transform:scaleY(.3)}to{transform:scaleY(1)}}</style>
  <rect width="800" height="450" fill="url(#g)"/>
  <g fill="#121212" opacity=".85">
    <rect class="b" x="470" y="110" width="26" height="230" rx="8" style="animation-delay:-.2s"/>
    <rect class="b" x="510" y="150" width="26" height="190" rx="8" style="animation-delay:-.6s"/>
    <rect class="b" x="550" y="80" width="26" height="260" rx="8" style="animation-delay:-.4s"/>
    <rect class="b" x="590" y="170" width="26" height="170" rx="8" style="animation-delay:-.8s"/>
    <rect class="b" x="630" y="120" width="26" height="220" rx="8" style="animation-delay:-.1s"/>
    <rect class="b" x="670" y="190" width="26" height="150" rx="8" style="animation-delay:-.5s"/>
  </g>
  <text x="48" y="96" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="16" fill="#121212" letter-spacing="3">A DATA PLATFORM FOR MY MUSIC</text>
  <text x="44" y="300" font-family="'Helvetica Neue',-apple-system,'Segoe UI',Arial,sans-serif" font-size="64" font-weight="900" fill="#121212">spotify-</text>
  <text x="44" y="364" font-family="'Helvetica Neue',-apple-system,'Segoe UI',Arial,sans-serif" font-size="64" font-weight="900" fill="#121212">stats</text>
  <text x="48" y="410" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#121212">Lambda → S3 → DuckDB → FastAPI</text>
</svg>
