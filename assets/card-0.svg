  <text x="48" y="96" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#121212" letter-spacing="3">A DATA PLATFORM FOR MY MUSIC</text>
  <text x="44" y="352" font-family="'Helvetica Neue',-apple-system,'Segoe UI',Arial,sans-serif" font-size="53" font-weight="900" fill="#121212">spotify-stats</text>
