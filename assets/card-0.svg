</svg></g>
  <text x="20" y="362" font-family="'Helvetica Neue',-apple-system,'Segoe UI',Arial,sans-serif" font-size="24" font-weight="800" fill="#ffffff">Spotify Stats</text>
  <rect x="20" y="376" width="116.4" height="24" rx="12" fill="#1ed760" fill-opacity=".14"/>
  <text x="32" y="393" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#1ed760" letter-spacing="1">IN PROGRESS</text>
  <text x="20" y="430" font-family="'Helvetica Neue',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#b3b3b3">A stats.fm-style listening tracker growing into a data platform. A</text><text x="20" y="452" font-family="'Helvetica Neue',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#b3b3b3">Lambda polls Spotify every 20 minutes, DuckDB crunches the stats</text><text x="20" y="474" font-family="'Helvetica Neue',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" fill="#b3b3b3">and FastAPI serves them.</text>
