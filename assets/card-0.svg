<svg xmlns="http://www.w3.org/2000/svg" width="580" height="568" viewBox="0 0 580 568" role="img" aria-label="Spotify Stats. A stats.fm-style listening tracker growing into a data platform. A Lambda polls Spotify every 20 minutes, DuckDB crunches the stats and FastAPI serves them.">
