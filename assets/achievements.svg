<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" role="img" aria-label="Achievements unlocked: First Class Honours in Computer Science. CASM Technology Track winner at HackSussex 2025. Cut Runna's deploy time by 70 percent.">
  <style>
    .t{opacity:0;transform:translateX(-40px);animation:in .6s cubic-bezier(.2,.7,.2,1) forwards}
    .t1{animation-delay:.3s}.t2{animation-delay:1.1s}.t3{animation-delay:1.9s}
    @keyframes in{to{opacity:1;transform:none}}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  </style>
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#0e1726"/><stop offset="1" stop-color="#111a2e"/></linearGradient>
  </defs>
  <g class="t t1">
    <rect x="10" y="10" width="800" height="82" rx="41" fill="url(#g)" stroke="#22d3ee" stroke-opacity=".45"/>
    <circle cx="51" cy="51" r="27" fill="#0e7490"/><text x="51" y="61" font-size="28" text-anchor="middle">🎓</text>
    <text x="96" y="42" class="mono" font-size="13" fill="#67e8f9" letter-spacing="2">ACHIEVEMENT UNLOCKED · 100G</text>
    <text x="96" y="70" class="sans" font-size="22" font-weight="700" fill="#f1f5f9">First Class Honours, BSc Computer Science</text>
  </g>
  <g class="t t2">
    <rect x="10" y="108" width="800" height="82" rx="41" fill="url(#g)" stroke="#a5b4fc" stroke-opacity=".45"/>
    <circle cx="51" cy="149" r="27" fill="#4338ca"/><text x="51" y="159" font-size="28" text-anchor="middle">🏆</text>
    <text x="96" y="140" class="mono" font-size="13" fill="#c7d2fe" letter-spacing="2">RARE ACHIEVEMENT · 50G</text>
    <text x="96" y="168" class="sans" font-size="22" font-weight="700" fill="#f1f5f9">Won the CASM Technology Track at HackSussex 2025</text>
  </g>
  <g class="t t3">
    <rect x="10" y="206" width="800" height="82" rx="41" fill="url(#g)" stroke="#fde68a" stroke-opacity=".45"/>
    <circle cx="51" cy="247" r="27" fill="#a16207"/><text x="51" y="257" font-size="28" text-anchor="middle">⚡</text>
    <text x="96" y="238" class="mono" font-size="13" fill="#fde68a" letter-spacing="2">SPEEDRUN · 30G</text>
    <text x="96" y="266" class="sans" font-size="22" font-weight="700" fill="#f1f5f9">Cut Runna's deploy time by 70% (1000s to 300s)</text>
  </g>
</svg>
