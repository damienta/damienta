<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Price Checker cover art">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5d33a"/><stop offset="1" stop-color="#e8743b"/></linearGradient></defs>
  <style>.d{animation:d 2.4s ease-in-out infinite}@keyframes d{0%,100%{transform:translateY(0)}50%{transform:translateY(14px)}}</style>
  <rect width="800" height="450" fill="url(#g)"/>
  <g transform="translate(500 90) rotate(12)">
    <path d="M0 40 L40 0 H200 V200 H40 L0 160 Z" fill="#121212"/>
    <circle cx="36" cy="100" r="12" fill="#f5d33a"/>
    <text x="120" y="118" font-family="'Helvetica Neue',-apple-system,Arial,sans-serif" font-size="58" font-weight="900" fill="#f5d33a" text-anchor="middle">£</text>
    <g class="d"><path d="M120 140 v30 M106 158 l14 14 14 -14" stroke="#1ed760" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
  <text x="48" y="96" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="16" fill="#121212" letter-spacing="3">BEST UK PRICE · 8AM DAILY</text>
  <text x="44" y="300" font-family="'Helvetica Neue',-apple-system,'Segoe UI',Arial,sans-serif" font-size="64" font-weight="900" fill="#121212">price-</text>
  <text x="44" y="364" font-family="'Helvetica Neue',-apple-system,'Segoe UI',Arial,sans-serif" font-size="64" font-weight="900" fill="#121212">checker</text>
  <text x="48" y="410" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#121212">GitHub Actions → Discord</text>
</svg>
